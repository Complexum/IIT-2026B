name = "demo"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["QSW"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# Linter de mathlib que exige cabecera de copyright; este no es un archivo de mathlib.
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.1"

[[lean_lib]]
name = "QSW"
