[project]
name = "iit-2026a"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.4",
    "scipy>=1.13.0",
    "pyphi==1.2.0",
    "pyinstrument==5.1.2",
    "openpyxl==3.1.3",
    "pyttsx3==2.98",
    "colorama==0.4.5",
    "textual>=3.0.0",
    "rich>=13.9.0",
    "polars>=1.40.1",
    "plotly>=6.7.0",
    "watchdog>=4.0.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]
anim = [
    "manim>=0.21.0",
]
# Backends paralelos para cluster (qn_mpi / qn_cuda). multiprocessing (qn_mul) es stdlib.
mpi = ["mpi4py>=3.1"]
cuda = ["cupy-cuda13x>=13"]  # ajustar al CUDA toolkit del cluster

[project.scripts]
cli        = "src.cli:main"
tui        = "src.tui.app:main"
strat      = "src.iit.strategies.scaffolder:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
